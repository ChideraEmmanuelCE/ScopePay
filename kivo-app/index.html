function notificationMenu(){return ui.notifications?'<div class="notice-menu"><h4>Notifications</h4>'+(state.notices.length?state.notices.slice(0,6).map(function(n){return '<div class="notice-line">'+ic('bell',15)+'<span>'+esc(n.text)+'<br><small style="color:#a8a1a9">'+shortDate(n.date)+'</small></span></div>'}).join(''):'<div class="notice-line">No new notifications</div>')+'</div>':''}
function modal(){if(!ui.modal)return '';var m=ui.modal,heading='',content='';if(m.type==='add'||m.type==='withdraw'){heading=m.type==='add'?'Add demo funds':'Withdraw demo funds';content='<p class="helper" style="margin:0 0 16px">This action only changes your on-screen sample balance.</p><form data-form="'+m.type+'"><div class="form-group"><label class="form-label">Amount in USD</label><input name="amount" class="field" min="0.01" max="100000" step=".01" required type="number" placeholder="100.00" autofocus></div><div class="form-error" id="form-error"></div><button type="submit" class="btn btn-purple btn-block">'+ic(m.type==='add'?'plus':'up',16)+' '+(m.type==='add'?'Add funds':'Withdraw funds')+'</button></form>'}else if(m.type==='contact'){heading='Add a recipient';content='<form data-form="contact"><div class="form-group"><label class="form-label">Full name</label><input name="name" class="field" required maxlength="60" placeholder="Taylor Parker"></div><div class="form-group"><label class="form-label">Email address</label><input type="email" name="email" class="field" required placeholder="taylor@example.com"></div><div class="form-error" id="form-error"></div><button type="submit" class="btn btn-purple btn-block">Save recipient</button></form>'}else if(m.type==='review'){heading='Review demo transfer';content='<div class="receipt-info"><div><span>Recipient</span><strong>'+esc(m.email)+'</strong></div><div><span>Amount</span><strong>'+money(m.amount)+'</strong></div><div><span>Transfer fee</span><strong>$0.00</strong></div><div><span>Balance after</span><strong>'+money(state.balance-m.amount)+'</strong></div><div><span>Note</span><strong>'+esc(m.note||'—')+'</strong></div></div><div class="info-box" style="margin-bottom:18px">'+ic('info',17)+' No real transfer will take place. Your demo balance will update.</div>'+action('confirm-transfer','Confirm demo transfer '+ic('send',16),'btn btn-purple btn-block')}else if(m.type==='success'){heading='All done';content='<div class="success-content"><div class="success-mark">'+ic('check',31)+'</div><h2>'+esc(m.title)+'</h2><p>'+esc(m.description)+'</p>'+(m.details?'<div class="receipt-info">'+m.details+'</div>':'')+action('close-modal','Done','btn btn-purple btn-block')+'</div>'}else if(m.type==='receipt'){heading='Transaction details';var t=state.transactions.find(function(x){return x.id===m.id});content=t?'<div class="success-content"><div class="success-mark">'+ic(t.amount>=0?'down':'up',28)+'</div><h2>'+(t.amount>=0?'+':'−')+money(t.amount)+'</h2><p>'+esc(t.name)+'</p><div class="receipt-info"><div><span>Status</span><strong>'+esc(t.status)+'</strong></div><div><span>Reference</span><strong>'+esc(t.id)+'</strong></div><div><span>Date</span><strong>'+dateFmt(t.date)+'</strong></div><div><span>Description</span><strong>'+esc(t.subtitle)+'</strong></div><div><span>Type</span><strong>Demo '+(t.amount>=0?'credit':'debit')+'</strong></div></div>'+action('close-modal','Close','btn btn-purple btn-block')+'</div>':'<p>Transaction not found.</p>'}else if(m.type==='card'){heading='Demo card details';content='<div class="receipt-info"><div><span>Card</span><strong>•••• 4829</strong></div><div><span>Expiry</span><strong>12/29 (sample)</strong></div><div><span>Security code</span><strong>Not issued</strong></div><div><span>Status</span><strong>'+(state.cardFrozen?'Frozen':'Demo active')+'</strong></div></div><p class="helper">No real card credentials exist. Never use these illustrative details for payments.</p>'}else if(m.type==='reset'){heading='Reset all demo data?';content='<p class="helper" style="margin-bottom:21px">This will restore your sample balance, sample contacts, requests, and transaction history in this browser. This cannot be undone.</p>'+action('confirm-reset','Yes, reset demo','btn btn-danger btn-block')}else return '';return '<div class="modal-layer" data-action="overlay-close"><div class="modal-box" role="dialog" aria-modal="true"><div class="modal-top"><h3>'+heading+'</h3>'+action('close-modal',ic('close',18),'modal-close','aria-label="Close dialog"')+'</div>'+content+'</div></div>'}
function render(){document.body.setAttribute('data-theme',state.theme);var el=document.getElementById('app');var pages={dashboard:dashboard,wallet:wallet,send:function(){return transferForm(false,ui.prefill||'')},request:requests,activity:activity,cards:cards,contacts:contacts,settings:settings,support:support};el.innerHTML='<div class="app-shell">'+sidebar()+'<main class="workspace">'+header()+(pages[ui.view]||dashboard)()+'</main></div>'+mobileBottom()+notificationMenu()+modal()+(ui.toast?'<div class="toast">'+ic('check',17)+esc(ui.toast)+'</div>':'')}
function setModal(type,other){ui.modal=Object.assign({type:type},other||{});render()}
function error(msg){var el=document.getElementById('form-error');if(el){el.style.display='block';el.textContent=msg}else toast(msg)}
document.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b)return;var a=b.dataset.action;if(a==='overlay-close'&&e.target!==b)return;
if(a==='nav'){navigate(b.dataset.view);return}
if(a==='mobile-menu'){ui.mobileMenu=!ui.mobileMenu;render();return}if(a==='close-menu'){ui.mobileMenu=false;render();return}
if(a==='notifications'){ui.notifications=!ui.notifications;render();return}
if(a==='toggle-balance'){state.showBalance=!state.showBalance;persist();render();return}
if(a==='modal-add'){setModal('add');return}if(a==='modal-withdraw'){setModal('withdraw');return}
if(a==='close-modal'||a==='overlay-close'){ui.modal=null;render();return}
if(a==='quick-send'||a==='quick-request'){ui.prefill=b.dataset.email;navigate(a==='quick-send'?'send':'request');return}
if(a==='prefill'){var input=document.getElementById('recipient');if(input){input.value=b.dataset.email;input.focus()}return}
if(a==='search-transactions'){ui.activitySearch=(document.getElementById('activity-search')||{}).value||'';render();return}
if(a==='export'){var columns=['ID','Date','Name','Description','Amount USD','Status'];var records=state.transactions.map(function(t){return [t.id,t.date,t.name,t.subtitle,t.amount.toFixed(2),t.status]});var csv=[columns].concat(records).map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var link=document.createElement('a');link.href=url;link.download='kivo-demo-transactions.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(url)},300);toast('Transaction CSV exported');return}
if(a==='receipt'){setModal('receipt',{id:b.dataset.id});return}
if(a==='freeze-card'){state.cardFrozen=!state.cardFrozen;persist();toast(state.cardFrozen?'Demo card frozen':'Demo card unfrozen');return}
if(a==='card-details'){setModal('card');return}
if(a==='add-contact'){setModal('contact');return}
if(a==='pay-request'){var r=state.requests.find(function(x){return x.id===b.dataset.id});if(!r||r.status!=='Pending')return;r.status='Paid (simulated)';state.balance+=r.amount;addTx(r.name||r.email,'Demo request payment',r.amount);setModal('success',{title:'Request marked as paid',description:'The simulated payment was credited to your demo wallet.'});return}
if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';persist();render();return}
if(a==='notify'){state.notificationsEnabled=!state.notificationsEnabled;persist();render();return}
if(a==='reset-demo'){setModal('reset');return}
if(a==='confirm-reset'){state=seed();persist();ui.modal=null;ui.prefill='';navigate('dashboard');toast('Demo restored');return}
if(a==='faq'){ui.faq=ui.faq===Number(b.dataset.id)?-1:Number(b.dataset.id);render();return}
if(a==='copy'){var txt=b.dataset.copy||'';if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Copied to clipboard')}).catch(function(){toast('Wallet ID: '+txt)})}else toast('Wallet ID: '+txt);return}
if(a==='confirm-transfer'){var m=ui.modal;if(!m||m.type!=='review')return;if(m.amount>state.balance){error('Insufficient demo funds');return}state.balance=Math.round((state.balance-m.amount)*100)/100;var contact=state.contacts.find(function(c){return c.email.toLowerCase()===m.email.toLowerCase()});var tx=addTx(contact?contact.name:m.email,m.note||'Demo transfer',-m.amount);setModal('success',{title:'Transfer complete!',description:'You sent '+money(m.amount)+' in demo funds. No real money was moved.',details:'<div><span>Recipient</span><strong>'+esc(m.email)+'</strong></div><div><span>Reference</span><strong>'+esc(tx.id)+'</strong></div>'});ui.prefill='';return}
});
document.addEventListener('change',function(e){if(e.target.dataset.change==='period'){ui.chartPeriod=e.target.value;render()}if(e.target.dataset.change==='activity-filter'){ui.activityFilter=e.target.value;ui.activitySearch=(document.getElementById('activity-search')||{}).value||'';render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}if(e.key==='Enter'&&e.target.id==='activity-search'){e.preventDefault();ui.activitySearch=e.target.value;render()}});
document.addEventListener('submit',function(e){var f=e.target;if(!f.dataset.form)return;e.preventDefault();var data=new FormData(f),type=f.dataset.form;var amount=Number(data.get('amount'));if(['send','request','add','withdraw'].indexOf(type)>-1){if(!Number.isFinite(amount)||amount<=0||Math.round(amount*100)/100!==amount){error('Enter a valid amount with at most two decimal places.');return}if(amount>100000){error('The demo limit is $100,000 per action.');return}}
if(type==='send'||type==='request'){var email=String(data.get('recipient')||'').trim().toLowerCase(),note=String(data.get('note')||'').trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){error('Enter a valid recipient email address.');return}if(email===state.profile.email.trim().toLowerCase()){error('Use a different recipient address.');return}if(type==='send'){if(amount>state.balance){error('Insufficient demo balance. Add sample funds first.');return}setModal('review',{email:email,amount:amount,note:note});return}var contact=state.contacts.find(function(c){return c.email.toLowerCase()===email});state.requests.unshift({id:'RQ'+Date.now(),name:contact?contact.name:email,email:email,amount:amount,note:note,status:'Pending',date:timeNow()});state.notices.unshift({text:'Created request for '+money(amount)+' from '+email,date:timeNow()});persist();setModal('success',{title:'Request created!',description:'The sample request is recorded in your browser. No email or payment was sent.'});ui.prefill='';return}
if(type==='add'||type==='withdraw'){if(type==='withdraw'&&amount>state.balance){error('Not enough demo funds to withdraw.');return}state.balance=Math.round((state.balance+(type==='add'?amount:-amount))*100)/100;addTx(type==='add'?'Demo balance top-up':'Demo withdrawal',type==='add'?'Simulated wallet funding':'Simulated wallet withdrawal',type==='add'?amount:-amount);setModal('success',{title:type==='add'?'Funds added!':'Withdrawal complete!',description:money(amount)+' was '+(type==='add'?'added to':'removed from')+' your demo balance. No banking transaction occurred.'});return}
if(type==='contact'){var n=String(data.get('name')||'').trim(),em=String(data.get('email')||'').trim().toLowerCase();if(n.length<2){error('Enter a full name.');return}if(state.contacts.some(function(c){return c.email.toLowerCase()===em})){error('This recipient already exists.');return}state.contacts.unshift({name:n,email:em});persist();ui.modal=null;toast('Recipient added');return}
if(type==='profile'){var name=String(data.get('name')||'').trim(),email=String(data.get('email')||'').trim().toLowerCase();if(name.length<2){error('Name must have at least two characters');return}state.profile.name=name;state.profile.email=email;persist();toast('Profile updated');return}
});
window.addEventListener('hashchange',function(){var v=(location.hash||'#dashboard').slice(1);if(views.indexOf(v)>-1&&v!==ui.view){ui.view=v;ui.modal=null;ui.prefill='';render()}});
render();
})();
</script>
</body>
</html>
